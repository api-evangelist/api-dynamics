domain_standard:
  market: API security / API access management
  declared: false
  detail: >-
    REWARD-ONLY CHECK, HONESTLY UNFILLED. The API-security market's nearest thing to a
    machine-readable domain standard would be an OCSF or STIX/TAXII finding feed, an OpenAPI
    x-agentic-access contract, or a published OWASP-API-Top-10-mapped rule set. APIDynamics
    declares none of these in a contract, because it publishes no contract. Nothing was
    invented to fill this slot.
  probed:
  - ocsf
  - stix-taxii
  - openapi-x-agentic-access
