note: >-
  APIDynamics sells API security, so its marketing names a great many standards. This file
  draws the line the rubric cares about: a standard the PRODUCT implements or the COMPANY
  holds, versus a standard APIDynamics helps its customers comply with. Everything in the
  second category is recorded with conforms:false and a `relationship: assists-customers`
  marker, because crediting it would be crediting a sales page. No certification is claimed
  by APIDynamics anywhere on its own site, so no Compliance pointer was emitted.
