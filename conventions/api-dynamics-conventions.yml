  confidence: medium
rate_limit_signaling:
  documented: false
  detail: >-
    No rate limits, quotas, throttle response code, or RateLimit/X-RateLimit/Retry-After
    header behaviour is published. See rate-limits/api-dynamics-rate-limits.yml.
reversibility:
  applicable: na
  grade: na
  detail: >-
    Nothing in the public APIDynamics surface is a write API. The three observed operations
    generate a one-time password, validate a one-time password, and score an inbound call —
    none of them creates, mutates or destroys a durable resource that a caller could need to
    take back, and no cancel/refund/void/undo/restore operation is documented anywhere. So
    reversibility, dry_run_mode and idempotency are all `na` for this provider rather than
    zero. If APIDynamics publishes a policy/configuration management API later, this block
    stops being na and needs a real answer.
  reversal_operations: []
  windows: []
