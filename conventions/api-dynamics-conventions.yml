note: >-
  APIDynamics publishes no OpenAPI, no API reference and no developer guide that resolves,
  so most cross-cutting semantics simply are not stated anywhere public. Every field below
  is either evidenced or explicitly marked unknown; nothing is inferred to fill a slot.
authentication:
  style: header-token
  detail: >-
    Two APIDynamics-specific headers identify the tenant and the calling client
    (X-API-Dynamics-Provider-Id, X-API-Dynamics-Client-Id). Step-up is TOTP or HMAC.
  see: authentication/api-dynamics-authentication.yml
  confidence: medium
idempotency:
  supported: unknown
  detail: >-
    No idempotency key, retry contract or replay-safety statement is published. The two
    observed read operations are GETs and therefore naturally safe to retry; the one
    observed write-shaped operation (POST /adaptive/server/validate) is a scoring call that
    returns a decision rather than creating a durable resource, but APIDynamics does not say
    whether repeating it is safe. Recorded as unknown, not as absent and not as supported.
  header: null
pagination:
  supported: unknown
  detail: No collection endpoint is published, so no pagination contract could be observed.
field_expansion:
  supported: unknown
metadata:
  supported: unknown
request_tracing:
  supported: partial
  detail: >-
    A caller-supplied transaction id (tid) threads a TOTP generate/validate pair, and the
    response echoes it back as transaction_id. That is a correlation identifier for one
    authentication transaction, not a general request-id tracing header. No X-Request-Id or
    equivalent is documented.
  parameter: tid
  response_field: transaction_id
  confidence: medium
versioning:
  scheme: unknown
  detail: >-
    The observed base path carries no version segment (/api/dynamics). No versioning policy,
    version header, or dated release train is published.
