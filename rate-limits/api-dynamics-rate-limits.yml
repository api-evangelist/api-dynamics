description: >-
  APIDynamics publishes no rate limits. No quota, window, burst ceiling, throttle status code
  or rate-limit response header is documented anywhere on the public site, and there is no API
  reference or OpenAPI to derive one from. limit_count is 0 and that is the honest measurement.
  REPLACES A SCAFFOLD: until this pass this file asserted five specific limits (10 rpm free,
  100 rpm professional, 1000 rpm enterprise, plus monthly quotas) and a full X-RateLimit-*
  header set, all written by the 2026-05-04 bulk sweep and none of it published by APIDynamics.
  Those values were fabrication and have been removed rather than re-dated.
